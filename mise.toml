# =====================================================================
# 도구 버전 고정 (Tool version pinning)
# ---------------------------------------------------------------------
# 실무에서 "내 컴퓨터에선 되는데?" 문제의 1순위 원인은 도구 버전 차이입니다.
# 이 파일 하나로 어느 컴퓨터에서든 `mise install` 한 번이면 같은 버전이 깔립니다.
# CI(GitHub Actions)도 이 파일을 읽어서 같은 버전을 씁니다.
# =====================================================================
[tools]
terraform = "1.17.1"
tflint    = "0.65.0"
aws-cli   = "2.39.5"

# 이 디렉터리 안에서만 적용되는 환경 변수.
# (셸에 `mise activate`가 설정돼 있으면 cd 하는 순간 자동 적용됩니다.)
# 회사/개인 실제 AWS 자격증명이 셸에 있어도, 이 폴더 안에서는 가짜 자격증명 +
# 로컬 엔드포인트로 덮어써서 "실수로 진짜 AWS를 건드리는 사고"를 막습니다.
[env]
AWS_ENDPOINT_URL      = "http://localhost:4566"
AWS_ACCESS_KEY_ID     = "test"
AWS_SECRET_ACCESS_KEY = "test"
AWS_DEFAULT_REGION    = "ap-northeast-2"
AWS_REGION            = "ap-northeast-2"
AWS_PROFILE           = false   # false = 이 폴더에선 해당 변수를 제거
AWS_SESSION_TOKEN     = false   # false = 이 폴더에선 해당 변수를 제거
